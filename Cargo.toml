[workspace]
resolver = "2"
members = [
    "crates/setbuddy-engine",
    "crates/setbuddy-mpv",
    "crates/setbuddy-core",
    "crates/setbuddy-cli",
    "crates/setbuddy-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"

[workspace.dependencies]
setbuddy-engine = { path = "crates/setbuddy-engine" }
setbuddy-mpv = { path = "crates/setbuddy-mpv" }
setbuddy-core = { path = "crates/setbuddy-core" }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Iteration speed: line tables are enough for backtraces and cut link time; a
# lightly optimised dev build keeps the mpv IPC tests and the GUI usable.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
